user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Gateway in front of the training Loki (loki-training is not published itself).
#   Writes: POST /loki/api/v1/push only, with the trainers' LOKI_USERNAME/LOKI_PASSWORD.
#   Public: GET on the query endpoints only. Everything else is refused.
http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=push:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=read:10m rate=10r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 3101;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Loki runs single-tenant; nobody picks a tenant through the gateway.
        proxy_set_header X-Scope-OrgID "";

        # Writes: trainers only.
        location = /loki/api/v1/push {
            limit_except POST { deny all; }
            auth_basic "Loki push";
            auth_basic_user_file /etc/nginx/.htpasswd;
            limit_req zone=push burst=200 nodelay;

            client_max_body_size 10M;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_pass http://loki-training:3100;
        }

        # Public, read-only: queries, GET only.
        location ~ ^/loki/api/v1/(query|query_range|labels|label/[^/]+/values|series|index/stats|tail)$ {
            limit_except GET { deny all; }
            limit_req zone=read burst=20 nodelay;

            client_max_body_size 1k;
            proxy_http_version 1.1;  # tail is a websocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_pass http://loki-training:3100;
        }

        location = /ready {
            limit_except GET { deny all; }
            proxy_pass http://loki-training:3100;
        }

        # Delete, config, ruler, other push paths, ...: closed.
        location / {
            return 403;
        }
    }
}
