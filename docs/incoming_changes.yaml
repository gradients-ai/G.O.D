# Incoming changes for miners.
#
# Each entry is a change that affects miners, with the UTC Monday it takes effect.
# Validate with: python -m ops.tools.incoming_changes.validate
#
# Fields:
#   id            kebab-case, unique; also used in the PR label `incoming:<id>`
#   title         short name
#   summary       1-2 miner-facing sentences
#   why           why the change is being made
#   areas         any of: text, image, compression
#   status        planned | in_progress | testing | shipped | postponed
#   date          ISO date (YYYY-MM-DD) of the UTC Monday the change takes effect
#   miner_action  what miners need to do, or "Nothing."
#   prs           gradients-ai/G.O.D PR numbers, e.g. [1432]
#   docs          repo-relative doc paths, e.g. [docs/miner.md]
#   shipped_on    ISO date the change merged, or null until shipped
#
# Merging a PR labelled `incoming:<id>` marks that entry shipped automatically
# (see docs/developer.md, "Incoming changes for miners").

changes:
  - id: threshold-recalibration
    title: Threshold recalibration and reward split
    summary: >-
      A challenger has to beat the boss by 1% in text and image tournaments. We re-measured whether that
      threshold is right, looking at three things: how much scores vary between runs of the boss's own code
      with different seeds, for each task type; the score gap at which people can see a difference between two
      models' outputs; and whether boss changes under past text thresholds (5%, then 4%, 3% and now 1%) show
      steady progress or wins by noise. The experiments found that a 1% difference in text and image is already
      below the point where people can see a change in the outputs, so lowering the threshold further would
      crown bosses without meaningfully improving the model customers receive. The 1% threshold will
      therefore stay. Instead, a larger share of each track's emissions will go to second and third place, and
      emissions will be redistributed between the text, image and compression tracks through an increase in dynamic
      allocation. We will also reduce the bar to beating the text boss by revamping the GRPO task (see "GRPO
      task revamp") and by no longer requiring a challenger to win the continuous training task to be crowned,
      only 5 of the 7 boss-round tasks.
    why: >-
      A boss should change only when a challenger is meaningfully better. A threshold inside run-to-run noise
      lets the boss change hands with little or no real improvement, while one set too high leaves real progress
      unrewarded. With the threshold already at the limit of what people can see, the way to keep participation
      high is to reward close competition directly, by paying second and third place more and by lowering
      the bar to beating the text boss.
    areas: [text, image, compression]
    status: in_progress
    date: 2026-12-07
    miner_action: >-
      Nothing. Expect larger rewards for second and third place, shifted emissions between tracks, and text boss
      rounds decided by 5 of the 7 tasks with the continuous training task no longer required.
    prs: []
    docs: []
    shipped_on: null

  - id: image-eval-hardening
    title: Image evaluation update and harder synthetic image tasks
    summary: >-
      The image evaluation moves to higher noise levels, and edit tasks will weigh the edited region and the
      rest of the image equally. Full details are in PR #1479
      (https://github.com/gradients-ai/G.O.D/pull/1479). Synthetics will also get a bit harder: each
      task is built around one concept locked to a reference image, captions no longer describe the concept,
      and the held-out test pairs are deliberately outside the training distribution. Both changes will be
      merged in time for the Monday 7 December tournament.
    why: >-
      Image training scripts were hitting a ceiling at the current difficulty, leaving little room to tell
      submissions apart. Harder tasks and evaluation give the best pipelines room to pull ahead again.
    areas: [image]
    status: in_progress
    date: 2026-12-07
    miner_action: >-
      Re-tune your image pipeline for the new evaluation, and make sure your LoRA learns the concept from the
      images rather than the caption and generalises beyond the training contexts.
    prs: [1479]
    docs: [docs/miner_image.md, docs/image_tasks.md]
    shipped_on: null

  - id: reward-split-and-fees
    title: New emission split, reign-based place shares and lower entry fees
    summary: >-
      This sets the numbers for the reward split announced in "Threshold recalibration and reward split".
      Guaranteed minimums become text 0.25, compression 0.15 and image 0.15, and the share that floats by
      participation grows from 0.25 to 0.45, so the largest share of emissions now floats based on dynamic entries
      rather than fixed values. Compression's floating share is no longer phased in: it competes for
      it like text and image from day one. Participation now counts contenders, miners ranked above the boss in round 1,
      rather than sign-ups. 1st place gets 85% of a tournament's share when a new boss takes the crown
      and in its first defence, then 1.5625 points less per defence down to 60% over time. The rest goes
      75/25 to 2nd and 3rd, so 2nd rises to 30% and 3rd to 10%. Entry fees drop to 0.6 TAO for text (from 0.7) and 0.5 TAO for compression (from
      0.6). Image stays at 0.4 TAO. Full details are in PR #1481
      (https://github.com/gradients-ai/G.O.D/pull/1481).
    why: >-
      A long-held crown should leave more on the table for the miners closing in on it, while a new boss still gets
      a strong reward for taking it. A larger floating share lets emissions follow where competition is thin, and
      counting only miners who beat the boss in round 1 keeps that share tied to real competition. Lower fees make
      it cheaper to compete.
    areas: [text, image, compression]
    status: in_progress
    date: 2026-12-07
    miner_action: >-
      Nothing. Only miners that rank above the boss in round 1 count toward a tournament's share of emissions.
    prs: [1481]
    docs: [docs/miner.md]
    shipped_on: null

  - id: grpo-revamp
    title: GRPO task revamp
    summary: >-
      The GRPO task in text tournaments will be restructured. Tasks will be able to include pre-generated
      rollouts with their rewards as training input, alongside the prompts. Reward functions will vary more from
      task to task and will be chosen to suit the dataset each task is drawn from, so that they measure what is
      useful for that data rather than applying the same generic checks everywhere. GRPO will also become the
      final task of round 3, the one that decides who goes through to the boss round. A later follow-up being
      considered would score the rollouts a submitted model produces during evaluation directly.
    why: >-
      GRPO research has moved on since the task was last updated, and we want to expand what we offer
      customers in this direction. Rollouts as training input and rewards matched to each dataset bring the
      task in line with how GRPO is used now.
    areas: [text]
    status: planned
    date: 2026-12-14
    miner_action: >-
      Before this date, update your GRPO pipeline to accept rollouts with rewards as training input when a task
      includes them, and stop relying on a fixed set of reward functions: read each task's reward functions from
      the task and test against a range of them.
    prs: []
    docs: []
    shipped_on: null

  - id: compression-nats-budget
    title: Compression quality budget in nats per token
    summary: >-
      Freeform compression submissions are judged against a fixed budget of extra loss per token instead of a
      percentage of the reference loss. A submission is within the line when its test loss is at most the
      reference model's loss plus the budget, in nats per token; going past it is penalised the same way as
      crossing the line is today. The allowed quality loss then means the same on every task, whether the base
      model is strong or weak. The budget value is set by the threshold recalibration and published in the docs
      before this date.
    why: >-
      A percentage of the reference loss gives weak models a much looser budget than strong ones: the same
      ratio allows far more extra loss per token on a model whose loss is already high. A fixed budget in nats
      per token keeps the quality a customer gets from a compressed model the same on every task.
    areas: [compression]
    status: planned
    date: 2026-12-14
    miner_action: >-
      Change how your pipeline sets its quality target, from the reference loss times 1.04 to the reference loss
      plus the budget, and re-tune your landing: expect less room on tasks whose base model has a high loss and
      more on tasks with a low loss. The budget is included in each task's published target, so read it from
      there rather than hard-coding it.
    prs: []
    docs: []
    shipped_on: null

  - id: fixed-vllm-quant-types
    title: More fixed quantisation formats
    summary: >-
      The fixed compression track adds more quantisation formats that vLLM can serve, alongside the current
      W2 and W3 integer formats. From this date fixed-track tasks can request any format on the list, and a
      submission must be in the requested format and load and run in vLLM to be scored. The list is set by a
      study of which formats vLLM runs with optimised kernels on H100 (Hopper) GPUs. Standard 4-bit and 8-bit
      formats are not on the list, because they leave little room to tell submissions apart. Specialised
      formats being explored include 4-bit integer weights with FP8 activations (W4A8), 4-bit floating-point
      weights (MXFP4, NVFP4, which run as weight-only formats on H100), and mixed precision per layer. Formats,
      group sizes and layouts are confirmed here as the study completes, and each is tested further before it
      is added to the validator.
    why: >-
      Compressed models are served with vLLM, so the formats that matter are the ones it runs efficiently.
      Covering more of them makes the fixed track reward compression that can be deployed directly.
    areas: [compression]
    status: planned
    date: 2026-12-14
    miner_action: >-
      Make sure your fixed-track pipeline can produce every format on the list in the layout vLLM expects, and
      test that each output loads and serves in vLLM before this date. A task you cannot produce in the
      requested format scores as a failure for that task.
    prs: []
    docs: []
    shipped_on: null
