name: Docker Images

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: Build every configured image regardless of changed files
        required: false
        default: true
        type: boolean
      only_quant_decoder:
        description: Build only the quant decoder images (overrides force_all)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changed-images.outputs.has_changes }}
      quant_decoder: ${{ steps.changed-images.outputs.quant_decoder }}
      matrix: ${{ steps.changed-images.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed image scopes
        id: changed-images
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all && !inputs.only_quant_decoder }}
          ONLY_QUANT_DECODER: ${{ github.event_name == 'workflow_dispatch' && inputs.only_quant_decoder }}
        run: |
          set -euo pipefail

          if [[ "${FORCE_ALL}" == "true" || "${ONLY_QUANT_DECODER}" == "true" ]]; then
            : > changed-files.txt
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BEFORE_SHA}" "${HEAD_SHA}" > changed-files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${HEAD_SHA}" > changed-files.txt
          fi

          python <<'PY'
          import fnmatch
          import json
          import os
          from pathlib import Path

          force_all = os.environ["FORCE_ALL"] == "true"
          only_quant_decoder = os.environ["ONLY_QUANT_DECODER"] == "true"
          changed_files = [
              line.strip()
              for line in Path("changed-files.txt").read_text().splitlines()
              if line.strip()
          ]

          images = [
              {
                  "id": "text-evaluator",
                  "image": "gradientsio/text-evaluator",
                  "channel_tag": "basilica",
                  "dockerfile": "ops/docker/validator.dockerfile",
                  "patterns": [
                      "validator/evaluation/**",
                      "ops/docker/validator.dockerfile",
                      "ops/docker/requirements/validator.txt",
                      ".dockerignore",
                  ],
                  "exclude_patterns": [
                      "validator/evaluation/basilica.py",
                      "validator/evaluation/db_utils.py",
                      "validator/evaluation/docker_evaluation.py",
                      "validator/scoring/tasks.py",
                      "validator/scoring/tournaments.py",
                  ],
              },
              {
                  "id": "quant-evaluator",
                  "image": "gradientsio/quant-evaluator",
                  "channel_tag": "basilica",
                  "dockerfile": "ops/docker/quant-evaluator.dockerfile",
                  "patterns": [
                      "validator/evaluation/**",
                      "core/**",
                      "pyproject.toml",
                      "ops/docker/quant-evaluator.dockerfile",
                      "ops/docker/requirements/quant-evaluator.txt",
                      ".dockerignore",
                  ],
                  "exclude_patterns": [
                      "validator/evaluation/basilica.py",
                      "validator/evaluation/db_utils.py",
                      "validator/evaluation/docker_evaluation.py",
                      "validator/scoring/tasks.py",
                      "validator/scoring/tournaments.py",
                  ],
              },
              {
                  "id": "image-evaluator",
                  "image": "gradientsio/image-evaluator",
                  "channel_tag": "basilica",
                  "dockerfile": "ops/docker/validator-diffusion.dockerfile",
                  "patterns": [
                      "validator/evaluation/**",
                      "ops/docker/validator-diffusion.dockerfile",
                      "ops/docker/requirements/image-evaluator.txt",
                      "ops/docker/scripts/image_eval_entrypoint.sh",
                      "core/models/**",
                      ".dockerignore",
                  ],
                  "exclude_patterns": [
                      "validator/evaluation/basilica.py",
                      "validator/evaluation/db_utils.py",
                      "validator/evaluation/docker_evaluation.py",
                      "validator/scoring/tasks.py",
                      "validator/scoring/tournaments.py",
                  ],
              },
              {
                  "id": "image-evaluator-toolkit",
                  "image": "gradientsio/image-evaluator-toolkit",
                  "channel_tag": "basilica",
                  "dockerfile": "ops/docker/validator-image-toolkit.dockerfile",
                  "patterns": [
                      "validator/evaluation/**",
                      "ops/docker/validator-image-toolkit.dockerfile",
                      "ops/docker/scripts/image_eval_entrypoint.sh",
                      "core/models/**",
                      "core/training_templates/**",
                      ".dockerignore",
                  ],
                  "exclude_patterns": [
                      "validator/evaluation/basilica.py",
                      "validator/evaluation/db_utils.py",
                      "validator/evaluation/docker_evaluation.py",
                      "validator/scoring/tasks.py",
                      "validator/scoring/tournaments.py",
                  ],
              },
              {
                  "id": "trainer-downloader",
                  "image": "gradientsio/trainer-downloader",
                  "channel_tag": "latest",
                  "dockerfile": "ops/docker/trainer-downloader.dockerfile",
                  "patterns": [
                      "ops/docker/trainer-downloader.dockerfile",
                      "trainer/**",
                      "core/**",
                      ".dockerignore",
                  ],
              },
              {
                  "id": "trainer-uploader",
                  "image": "gradientsio/trainer-uploader",
                  "channel_tag": "latest",
                  "dockerfile": "ops/docker/hf-uploader.dockerfile",
                  "patterns": [
                      "ops/docker/hf-uploader.dockerfile",
                      "trainer/**",
                      "core/**",
                      ".dockerignore",
                  ],
              },
              {
                  "id": "trainer-cacher-cleaner",
                  "image": "gradientsio/trainer-cacher-cleaner",
                  "channel_tag": "latest",
                  "dockerfile": "ops/docker/cache-cleanup.dockerfile",
                  "patterns": [
                      "ops/docker/cache-cleanup.dockerfile",
                      "core/**",
                      "trainer/**",
                      ".dockerignore",
                  ],
              },
              {
                  "id": "model-prep-text",
                  "image": "gradientsio/model-prep-text",
                  "channel_tag": "latest",
                  "dockerfile": "ops/docker/model-prep-text.dockerfile",
                  "patterns": [
                      "ops/docker/model-prep-text.dockerfile",
                      "trainer/model_prep/**",
                      "core/**",
                      ".dockerignore",
                  ],
              },
          ]

          # The decoder build image is FROM the decoder run image, so the pair is built
          # in order by one job instead of as independent matrix entries.
          quant_decoder_patterns = [
              "ops/docker/quant-decoder-run.dockerfile",
              "ops/docker/quant-decoder-build.dockerfile",
          ]

          def is_match(path: str, pattern: str) -> bool:
              if pattern.endswith("/**"):
                  prefix = pattern[:-3]
                  return path == prefix or path.startswith(f"{prefix}/")
              return fnmatch.fnmatch(path, pattern)

          selected = []
          for image in images:
              if force_all or any(
                  any(is_match(path, pattern) for pattern in image["patterns"])
                  and not any(is_match(path, pattern) for pattern in image.get("exclude_patterns", []))
                  for path in changed_files
              ):
                  selected.append({
                      key: value
                      for key, value in image.items()
                      if key not in {"patterns", "exclude_patterns"}
                  })

          quant_decoder = force_all or only_quant_decoder or any(
              is_match(path, pattern) for path in changed_files for pattern in quant_decoder_patterns
          )

          matrix = {"include": selected}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_changes={str(bool(selected)).lower()}\n")
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"quant_decoder={str(quant_decoder).lower()}\n")

          if force_all:
              print("Force-all mode selected every configured image.")
          elif only_quant_decoder:
              print("Only the quant decoder images were requested.")
          else:
              print("Changed files:")
              for path in changed_files:
                  print(f"  {path}")

          print("Selected images:")
          for image in selected:
              print(f"  {image['id']}: {image['image']}:{image['channel_tag']}")
          if quant_decoder:
              print("  quant-decoder: gradientsio/quant-decoder-run:pinned, gradientsio/quant-decoder-build:pinned")
          PY

  build:
    name: Build ${{ matrix.id }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    env:
      PUSH_IMAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: |
            ${{ matrix.image }}:${{ matrix.channel_tag }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }},ignore-error=true

  quant-decoder:
    name: Build quant-decoder
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.quant_decoder == 'true'
    env:
      PUSH_IMAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
      RUN_IMAGE: gradientsio/quant-decoder-run
      BUILD_IMAGE: gradientsio/quant-decoder-build
      LOCAL_RUN_IMAGE: localhost:5000/quant-decoder-run:pinned
      LOCAL_BUILD_IMAGE: localhost:5000/quant-decoder-build:pinned
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - name: Login to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both images go to a registry local to this job first, so the build image is always
      # built on the run image from this commit and never on a published one.
      - name: Build run image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/quant-decoder-run.dockerfile
          push: true
          tags: ${{ env.LOCAL_RUN_IMAGE }}
          cache-from: type=gha,scope=quant-decoder-run
          cache-to: type=gha,mode=max,scope=quant-decoder-run,ignore-error=true

      - name: Build build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/quant-decoder-build.dockerfile
          build-contexts: |
            ${{ env.RUN_IMAGE }}:pinned=docker-image://${{ env.LOCAL_RUN_IMAGE }}
          push: true
          tags: ${{ env.LOCAL_BUILD_IMAGE }}
          cache-from: type=gha,scope=quant-decoder-build
          cache-to: type=gha,mode=max,scope=quant-decoder-build,ignore-error=true

      # Copies the exact images built above, run image first, so a published build image
      # always has its run image published. Without push rights the copy stays in the local registry.
      - name: Publish images
        shell: bash
        env:
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          prefix=""
          if [[ "${PUSH_IMAGE}" != "true" ]]; then
            prefix="localhost:5000/unpublished/"
          fi

          publish() {
            local source="$1" target="${prefix}$2"
            docker buildx imagetools create -t "${target}:pinned" -t "${target}:${SHA_TAG}" "${source}"
            local source_digest target_digest
            source_digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "${source}")"
            target_digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "${target}:pinned")"
            echo "${target}:pinned ${target_digest}"
            if [[ "${source_digest}" != "${target_digest}" ]]; then
              echo "::error::${target}:pinned does not match the image built in this run (${source_digest})"
              exit 1
            fi
          }

          publish "${LOCAL_RUN_IMAGE}" "${RUN_IMAGE}"
          publish "${LOCAL_BUILD_IMAGE}" "${BUILD_IMAGE}"
